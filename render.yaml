services:
  # ── Backend (Spring Boot + Supabase Postgres) ──────────────
  - type: web
    name: badminton-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:6543/postgres
      - key: SPRING_DATASOURCE_USERNAME
        value: postgres.ldubpjthhruvbbktmwkp
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false          # ⬅ set in Render Dashboard (your Supabase DB password)
      - key: CORS_ALLOWED_ORIGINS
        value: https://badminton-frontend.onrender.com
      - key: JAVA_OPTS
        value: "-Xms256m -Xmx512m"

  # ── Frontend (React / Vite + Nginx reverse proxy) ──────────
  - type: web
    name: badminton-frontend
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "10000"
      - key: BACKEND_URL
        value: https://badminton-backend.onrender.com
