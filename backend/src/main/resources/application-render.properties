# ===== Render deployment profile =====
# Supabase Postgres via transaction pooler (PgBouncer)
# Datasource is configured via env vars:
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD

# HikariCP — keep pool small (Supabase free tier ~60 connections total)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=300000

# Hibernate — let Flyway own schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway — run migrations on startup
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# PgBouncer (Supabase transaction pooler) is incompatible with
# session-level advisory locks; disable them here.
spring.flyway.postgresql.transactional.lock=false

# CORS — set via CORS_ALLOWED_ORIGINS env var (e.g. https://your-app.onrender.com)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Render assigns a dynamic $PORT; fall back to 8080 locally
server.port=${PORT:8080}
server.forward-headers-strategy=native

# Actuator — needed for Render health check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging — minimal in production
logging.level.com.example.badminton=INFO
logging.level.org.hibernate.SQL=WARN
