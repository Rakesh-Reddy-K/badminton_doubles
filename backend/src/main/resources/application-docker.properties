# Docker profile - overrides default
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/badminton}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:badminton}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:badminton_secret}

# CORS - environment configurable
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
