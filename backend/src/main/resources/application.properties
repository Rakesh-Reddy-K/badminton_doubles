# ===== Default (local dev) profile =====
spring.datasource.url=jdbc:postgresql://localhost:5432/badminton
spring.datasource.username=badminton
spring.datasource.password=badminton_secret
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Server
server.port=8080

# CORS (comma separated origins)
cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Logging
logging.level.com.example.badminton=DEBUG
logging.level.org.hibernate.SQL=INFO
